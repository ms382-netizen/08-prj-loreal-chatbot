<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>L'Oréal Beauty Advisor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="site-header">
    <!-- Logo file comes from your starter code -->
    <img src="img/loreal-logo.png" alt="L'Oréal Paris" class="logo" />
    <h1>Beauty Advisor</h1>
  </header>

  <main class="chatbot">
    <p class="latest-question" id="latestQuestion" hidden></p>

    <div class="chat-window" id="chatWindow" aria-live="polite">
      <div class="msg ai">Bonjour! I'm your L'Oréal beauty advisor. Ask me about makeup, skincare, haircare, fragrance, or a routine built for you.</div>
    </div>

    <form class="chat-form" id="chatForm">
      <input type="text" id="userInput" placeholder="Ask about a product or routine…" autocomplete="off" required />
      <button type="submit" id="sendBtn" aria-label="Send message">Send</button>
    </form>
  </main>

  <footer class="site-footer">
    <p>© L'Oréal. Student project. Not an official L'Oréal product.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
